[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyto-lab"
version = "0.1.0"
description = "Small Python PxC and PCR composition primitives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
px = "pyto.px:main"

[project.optional-dependencies]
drawing = ["Pillow>=10"]
# the brain: every statistics, machine learning and data-science capability as
# Calculations, on a backend fast enough to deserve them (experiments/brain).
brain = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]
