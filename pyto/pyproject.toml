[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyto-lab"
version = "0.1.0"
description = "Small Python PxC and PCR composition primitives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
drawing = ["Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]
